<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quora Discussion Standards & Ground Rules</title>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem("robot_dividend_theme");
        if (theme === "dark" || (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("theme-dark");
          document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add("theme-dark");
          });
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/robotDividend.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--reader-bg, #faf7f2);
      color: var(--reader-text, #1f242e);
      font-family: var(--reader-font-body, 'Newsreader', Georgia, serif);
    }
    body.theme-dark {
      background-color: #0f141c;
      color: #e2e8f0;
    }
    .rules-nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: var(--reader-toolbar-bg, rgba(250, 247, 242, 0.94));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--reader-toolbar-border, rgba(0, 0, 0, 0.08));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
    }
    .rules-back-link {
      font-family: var(--reader-font-sans, -apple-system, sans-serif);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--reader-accent, #2563eb);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }
    .rules-back-link:hover {
      transform: translateX(-2px);
    }
    .rules-container-shell {
      max-width: 720px;
      margin: 90px auto 100px auto;
      padding: 0 20px;
    }
    .theme-toggle-btn-small {
      background: var(--reader-surface, #ffffff);
      border: 1px solid var(--reader-border, #e6dfd5);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.86rem;
      cursor: pointer;
      color: var(--reader-text, #1f242e);
    }
  </style>
  <script src="js/RulesContent.js"></script>
</head>
<body>
  <header class="rules-nav-bar">
    <a href="index.html" class="rules-back-link">
      <span>←</span>
      <span>Back to The Robot Dividend Series</span>
    </a>
    <button class="theme-toggle-btn-small" onclick="toggleTheme()" title="Toggle theme">🌓</button>
  </header>

  <main class="rules-container-shell" id="rules-root"></main>

  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle("theme-dark");
      localStorage.setItem("robot_dividend_theme", isDark ? "dark" : "light");
    }

    function formatInline(text) {
      if (!text || typeof text !== "string") return text || "";
      return text
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" style="color:var(--reader-accent);font-weight:600;">$1</a>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');
    }

    document.addEventListener("DOMContentLoaded", function() {
      const root = document.getElementById("rules-root");
      if (!root || typeof RulesContent === "undefined") return;

      const meta = RulesContent.getMeta();
      const manifest = RulesContent.manifest();

      // Render Header
      const header = document.createElement("header");
      header.className = "article-header";
      header.innerHTML = `
        <div class="article-meta-row">
          <span class="article-kicker">${meta.kicker}</span>
          <span class="article-read-time">Standalone Reference Document</span>
        </div>
        <h1 class="article-title">${meta.title}</h1>
        <p class="article-subtitle">${meta.subtitle}</p>
      `;
      root.appendChild(header);

      manifest.forEach(sec => {
        const secEl = document.createElement("section");
        secEl.className = "section-divider";

        if (sec.partLabel) {
          const lbl = document.createElement("div");
          lbl.className = "section-part-label";
          lbl.textContent = sec.partLabel;
          secEl.appendChild(lbl);
        }

        const heading = document.createElement("h2");
        heading.className = "section-heading";
        heading.textContent = sec.title;
        secEl.appendChild(heading);

        sec.blocks.forEach(b => {
          const variants = (typeof RulesContent[b.id] === "function") ? RulesContent[b.id]() : [];
          const text = variants[0] || "";

          if (b.type === "sidebar") {
            const aside = document.createElement("aside");
            aside.className = "block-sidebar";
            aside.id = b.id;

            let kickerHtml = b.kicker ? `<div class="block-sidebar-kicker">${b.kicker}</div>` : '';
            let titleHtml = b.title ? `<div class="block-sidebar-title">${b.title}</div>` : '';

            const paragraphs = text.split(/\n\s*\n/).map(p => `<p>${formatInline(p)}</p>`).join("");
            aside.innerHTML = `
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                ${kickerHtml}
                <button class="block-share-badge" onclick="copyAnchor('${b.id}')">🔗 Copy Link</button>
              </div>
              ${titleHtml}
              <div class="block-sidebar-body">${paragraphs}</div>
            `;
            secEl.appendChild(aside);
          } else {
            const p = document.createElement("div");
            p.className = "block-wrapper";
            p.id = b.id;
            const paragraphs = text.split(/\n\s*\n/).map(txt => `<p class="block-p">${formatInline(txt)}</p>`).join("");
            p.innerHTML = paragraphs;
            secEl.appendChild(p);
          }
        });

        root.appendChild(secEl);
      });

      // Handle anchor deep-link if requested in URL
      if (window.location.hash) {
        const id = window.location.hash.replace(/^#/, "");
        const target = document.getElementById(id);
        if (target) {
          setTimeout(() => {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
            target.classList.add("target-pulse-highlight");
          }, 200);
        }
      }
    });

    function copyAnchor(id) {
      const url = window.location.origin + window.location.pathname + "#" + id;
      navigator.clipboard.writeText(url).then(() => {
        alert("Copied link to #" + id);
      });
    }
  </script>
</body>
</html>
