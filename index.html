<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Robot Dividend & Economics of Automation</title>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem("robot_dividend_theme");
        if (theme === "dark" || (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("theme-dark");
          document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add("theme-dark");
          });
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/robotDividend.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--reader-bg, #faf7f2);
      color: var(--reader-text, #1f242e);
      font-family: var(--reader-font-body, 'Newsreader', Georgia, serif);
    }
    body.theme-dark {
      background-color: #0f141c;
      color: #e2e8f0;
    }
    #app-root {
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }
  </style>
  <script src="/Library/LunoLoader.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/Library/LunoLoader.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/Library/LunoLoader.js'; }; })(this);"></script>
</head>
<body>
  <div id="app-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof LunoLoader !== "undefined") {
        LunoLoader.loadApp("app-root");
      }
    });
  </script>
</body>
</html>
